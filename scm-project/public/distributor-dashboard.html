<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distributor Dashboard - SCM System</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: white;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      border: 2px solid black;
      padding: 1.5rem;
      background: white;
    }
    
    .stat-card h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
    }
    
    .tabs {
      display: flex;
      margin-bottom: 2rem;
      border-bottom: 2px solid black;
    }
    
    .tab {
      padding: 0.75rem 1.5rem;
      background: white;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: bold;
      color: black;
    }
    
    .tab.active {
      border-bottom-color: black;
    }
    
    .tab:hover {
      background: #f5f5f5;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .section {
      border: 2px solid black;
      padding: 1.5rem;
      margin-bottom: 2rem;
      background: white;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid black;
      padding-bottom: 1rem;
    }
    
    .section-header h2 {
      margin: 0;
      border: none;
      padding: 0;
    }
    
    .order-filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .filter-btn {
      border: 1px solid black;
      background: white;
      padding: 0.35rem 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    
    .filter-btn.active {
      background: black;
      color: white;
    }
    
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    
    .product-card {
      border: 1px solid black;
      padding: 1rem;
      background: white;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    
    th, td {
      border: 1px solid black;
      padding: 0.75rem;
      text-align: left;
    }
    
    th {
      background: black;
      color: white;
    }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border: 1px solid black;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content {
      background: white;
      margin: 50px auto;
      padding: 2rem;
      border: 2px solid black;
      max-width: 600px;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid black;
      padding-bottom: 0.5rem;
    }
    
    .btn-group,
    .form-group {
      margin-bottom: 1rem;
    }
    
    .form-group label {
      font-weight: bold;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid black;
      background: white;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-brand">
      <img src="assets/logo.png" alt="the-Weft logo" class="logo">
      <h1>Distributor Dashboard</h1>
    </div>
    <nav>
      <span id="userEmail" style="margin-right: 1rem;"></span>
      <button onclick="logout()">Logout</button>
    </nav>
  </header>

  <div class="container">
    <!-- Stats -->
    <div id="stats-section" class="stat-grid"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('catalog')">Manufacturer Catalog</button>
      <button class="tab" onclick="switchTab('orders')">My Purchase Orders</button>
      <button class="tab" onclick="switchTab('sales')">Sales to Retailers</button>
      <button class="tab" onclick="switchTab('inventory')">My Inventory</button>
    </div>

    <!-- Catalog Tab -->
    <div id="catalog" class="tab-content active">
      <div class="section">
        <div class="section-header">
          <h2>Manufacturer Catalog</h2>
          <button onclick="refreshCatalog()">Refresh</button>
        </div>
        <div id="catalogGrid" class="product-grid"></div>
      </div>
    </div>

    <!-- Orders Tab -->
    <div id="orders" class="tab-content">
      <div class="section">
        <div class="section-header">
          <h2>My Purchase Orders</h2>
          <div class="order-filters">
            <button class="filter-btn active" onclick="filterOrders(event, 'All')">All</button>
            <button class="filter-btn" onclick="filterOrders(event, 'Pending')">Pending</button>
            <button class="filter-btn" onclick="filterOrders(event, 'Confirmed')">Confirmed</button>
            <button class="filter-btn" onclick="filterOrders(event, 'Shipped')">Shipped</button>
            <button class="filter-btn" onclick="filterOrders(event, 'Received')">Received</button>
          </div>
        </div>
        <div id="ordersList"></div>
      </div>
    </div>

    <!-- Sales Tab -->
    <div id="sales" class="tab-content">
      <div class="section">
        <div class="section-header">
          <h2>Sales to Retailers</h2>
          <div class="order-filters">
            <button class="filter-btn active" onclick="filterSales(event, 'All')">All</button>
            <button class="filter-btn" onclick="filterSales(event, 'Pending')">Pending</button>
            <button class="filter-btn" onclick="filterSales(event, 'Confirmed')">Confirmed</button>
            <button class="filter-btn" onclick="filterSales(event, 'Shipped')">Shipped</button>
            <button class="filter-btn" onclick="filterSales(event, 'Received')">Received</button>
            <button class="btn" onclick="loadSales()">Refresh</button>
          </div>
        </div>
        <div id="salesList"></div>
      </div>
    </div>

    <!-- Inventory Tab -->
    <div id="inventory" class="tab-content">
      <div class="section">
        <div class="section-header">
          <h2>My Inventory</h2>
          <button onclick="loadInventory()">Refresh</button>
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Manufacturer</th>
                <th>Available</th>
                <th>Reserved</th>
                <th>Purchase Price</th>
                <th>Retail Price</th>
                <th>Profit Margin</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Order Modal -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create Purchase Order</h2>
        <button class="close-modal" onclick="closeOrderModal()">&times;</button>
      </div>
      <form id="createOrderForm" onsubmit="submitOrder(event)">
        <input type="hidden" id="orderManufacturerId">
        
        <div class="form-group">
          <label>Manufacturer:</label>
          <input type="text" id="orderManufacturerName" readonly>
        </div>
        
        <div id="orderItemsContainer">
          <div class="order-item-row">
            <div class="form-group">
              <label>Product:</label>
              <input type="text" id="orderProductName" readonly>
              <input type="hidden" id="orderProductId">
            </div>
            
            <div class="form-group">
              <label>Quantity:</label>
              <input type="number" id="orderQuantity" min="1" required>
              <small id="orderMOQ"></small>
            </div>
            
            <div class="form-group">
              <label>Unit Price:</label>
              <input type="text" id="orderUnitPrice" readonly>
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label>Payment Terms:</label>
          <select id="paymentTerms">
            <option value="Net 30">Net 30</option>
            <option value="Net 60">Net 60</option>
            <option value="Net 90">Net 90</option>
            <option value="Prepaid">Prepaid</option>
            <option value="COD">Cash on Delivery</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Notes (Optional):</label>
          <textarea id="orderNotes" placeholder="Any special instructions..."></textarea>
        </div>
        
        <div class="btn-group">
          <button type="submit" class="btn btn-primary">Create Order</button>
          <button type="button" class="btn" onclick="closeOrderModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Set Pricing Modal -->
  <div id="pricingModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Set Retailer Pricing</h2>
        <button class="close-modal" onclick="closePricingModal()">&times;</button>
      </div>
      <form id="setPricingForm" onsubmit="submitPricing(event)">
        <input type="hidden" id="pricingProductId">
        
        <div class="form-group">
          <label>Product:</label>
          <input type="text" id="pricingProductName" readonly>
        </div>
        
        <div class="form-group">
          <label>Your Purchase Price:</label>
          <input type="text" id="pricingPurchasePrice" readonly>
        </div>
        
        <div class="form-group">
          <label>Retailer Selling Price:</label>
          <input type="number" id="pricingSellPrice" step="0.01" min="0.01" required>
          <small>Must be higher than your purchase price</small>
        </div>
        
        <div class="form-group">
          <label>Estimated Profit Margin:</label>
          <input type="text" id="pricingProfitMargin" readonly>
        </div>
        
        <div class="btn-group">
          <button type="submit" class="btn btn-primary">Update Pricing</button>
          <button type="button" class="btn" onclick="closePricingModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;

    // Initialize
    async function init() {
      try {
        // Try both sessionStorage and localStorage
        const sessionUser = sessionStorage.getItem('currentUser');
        const localUser = localStorage.getItem('user');
        
        console.log('Session user:', sessionUser ? 'Found' : 'Not found');
        console.log('Local user:', localUser ? 'Found' : 'Not found');
        
        currentUser = JSON.parse(sessionUser || localUser);
        
        if (!currentUser) {
          console.error('No user found in storage');
          alert('Please log in as a distributor.');
          window.location.href = 'index.html';
          return;
        }
        
        console.log('Current user loaded:', currentUser);
        console.log('User role:', currentUser.Role);
        
        if (currentUser.Role !== 'Distributor') {
          console.error('Invalid role:', currentUser.Role);
          alert('Access denied. This dashboard is for distributors only.');
          window.location.href = 'index.html';
          return;
        }
        
        console.log('User authenticated successfully');
        document.getElementById('userEmail').textContent = currentUser.Email;
        
        await loadCatalog();
        loadDistributorStats();
      } catch (error) {
        console.error('Initialization error:', error);
        alert('Error loading dashboard: ' + error.message + '\nPlease try logging in again.');
        window.location.href = 'index.html';
      }
    }

    // Tab Switching
    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.querySelector(`.tab[onclick*="${tabName}"]`);
      if (activeBtn) activeBtn.classList.add('active');
      
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      const target = document.getElementById(tabName);
      if (target) target.classList.add('active');
      
      if (tabName === 'catalog') loadCatalog();
      if (tabName === 'orders') loadOrders();
      if (tabName === 'sales') loadSales();
      if (tabName === 'inventory') loadInventory();
    }

    // Load Manufacturer Catalog
    async function loadCatalog() {
      try {
        const response = await fetch('/api/distributor/catalog');
        const products = await response.json();
        
        console.log('Catalog loaded:', products.length, 'products');
        
        const grid = document.getElementById('catalogGrid');
        if (!products || products.length === 0) {
          grid.innerHTML = '<p>No products available from manufacturers.</p>';
          return;
        }
        
        grid.innerHTML = products.map((p, index) => `
          <div class="product-card" id="product-${index}">
            <h3>${p.ProductName}</h3>
            <p style="color: #666; font-size: 14px; margin: 10px 0;">${p.Description || 'No description'}</p>
            <div class="product-info">
              <div><label>Manufacturer:</label><span>${p.ManufacturerName}</span></div>
              <div><label>Price:</label><span class="profit-positive">${p.ManufacturerPrice ? '$' + p.ManufacturerPrice : 'Contact Manufacturer'}</span></div>
              <div><label>MOQ:</label><span>${p.MinOrderQuantity || 1} units</span></div>
              <div><label>In Stock:</label><span style="color: ${p.ManufacturerStock > 0 ? '#4CAF50' : '#F44336'};">${p.ManufacturerStock || 0} units</span></div>
              <div><label>Lead Time:</label><span>${p.LeadTimeDays || 'N/A'} days</span></div>
            </div>
            <button class="btn btn-primary" onclick="openOrderModal(${index})" 
                    ${p.ManufacturerStock === 0 || !p.ManufacturerPrice ? 'disabled' : ''}>
              ${p.ManufacturerStock === 0 ? 'Out of Stock' : !p.ManufacturerPrice ? 'Price Not Set' : 'Place Order'}
            </button>
          </div>
        `).join('');
        
        // Store products globally for later access
        window.catalogProducts = products;
        
      } catch (error) {
        console.error('Error loading catalog:', error);
        document.getElementById('catalogGrid').innerHTML = '<p class="error">Error loading catalog. Please try again.</p>';
      }
    }

    function refreshCatalog() {
      loadCatalog();
    }

    async function loadDistributorStats() {
      if (!currentUser) return;
      const statsContainer = document.getElementById('stats-section');
      if (!statsContainer) return;
      
      try {
        const [catalogRes, ordersRes, salesRes, inventoryRes] = await Promise.all([
          fetch('/api/distributor/catalog'),
          fetch(`/api/distributor/${currentUser.UserID}/orders`),
          fetch(`/api/distributor/${currentUser.UserID}/sales`),
          fetch(`/api/distributor/${currentUser.UserID}/inventory`)
        ]);
        
        const [catalog, orders, sales, inventory] = await Promise.all([
          catalogRes.json(),
          ordersRes.json(),
          salesRes.json(),
          inventoryRes.json()
        ]);
        
        const pendingPurchase = Array.isArray(orders) ? orders.filter(o => o.Status === 'Pending').length : 0;
        const pendingSales = Array.isArray(sales) ? sales.filter(o => o.Status === 'Pending').length : 0;
        const totalProducts = Array.isArray(catalog) ? catalog.length : 0;
        const inventoryValue = Array.isArray(inventory)
          ? inventory.reduce((sum, item) => {
              const price = parseFloat(item.PurchasePriceFromManufacturer || 0);
              const qty = parseFloat(item.AvailableForSale || 0);
              return sum + (price * qty);
            }, 0)
          : 0;
        
        statsContainer.innerHTML = `
          <div class="stat-card">
            <h3>Catalog Products</h3>
            <div class="stat-value">${totalProducts}</div>
          </div>
          <div class="stat-card">
            <h3>Pending Purchase Orders</h3>
            <div class="stat-value">${pendingPurchase}</div>
          </div>
          <div class="stat-card">
            <h3>Pending Retailer Orders</h3>
            <div class="stat-value">${pendingSales}</div>
          </div>
          <div class="stat-card">
            <h3>Inventory Cost Value</h3>
            <div class="stat-value">$${inventoryValue.toFixed(0)}</div>
          </div>
        `;
      } catch (error) {
        console.error('Failed to load stats:', error);
        statsContainer.innerHTML = '<p class="error">Failed to load stats.</p>';
      }
    }

    // Order Modal
    function openOrderModal(productIndex) {
      const product = window.catalogProducts[productIndex];
      if (!product) {
        alert('Product not found');
        return;
      }
      document.getElementById('orderManufacturerId').value = product.ManufacturerID;
      document.getElementById('orderManufacturerName').value = product.ManufacturerName;
      document.getElementById('orderProductId').value = product.ProductID;
      document.getElementById('orderProductName').value = product.ProductName;
      document.getElementById('orderUnitPrice').value = '$' + product.ManufacturerPrice;
      document.getElementById('orderQuantity').value = product.MinOrderQuantity;
      document.getElementById('orderMOQ').textContent = `Minimum: ${product.MinOrderQuantity} units`;
      
      document.getElementById('orderModal').classList.add('active');
    }

    function closeOrderModal() {
      document.getElementById('orderModal').classList.remove('active');
      document.getElementById('createOrderForm').reset();
    }

    async function submitOrder(event) {
      event.preventDefault();
      
      const orderData = {
        ManufacturerID: parseInt(document.getElementById('orderManufacturerId').value),
        items: [{
          ProductID: parseInt(document.getElementById('orderProductId').value),
          Quantity: parseInt(document.getElementById('orderQuantity').value)
        }],
        PaymentTerms: document.getElementById('paymentTerms').value,
        Notes: document.getElementById('orderNotes').value
      };
      
      try {
        const response = await fetch(`/api/distributor/${currentUser.UserID}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert(`✅ ${result.message}\nOrder ID: ${result.OrderID}\nTotal: $${result.TotalAmount.toLocaleString()}\nExpected Delivery: ${result.ExpectedDeliveryDate}`);
          closeOrderModal();
          // Switch to orders tab
          switchTab('orders');
          loadOrders();
        } else {
          alert('❌ ' + result.message);
        }
      } catch (error) {
        console.error('Error creating order:', error);
        alert('Failed to create order.');
      }
    }

    // Load Orders
    let currentOrderFilter = 'All';
    
    function filterOrders(evt, status) {
      currentOrderFilter = status;
      
      if (evt) {
        document.querySelectorAll('#orders .filter-btn').forEach(btn => btn.classList.remove('active'));
        evt.currentTarget.classList.add('active');
      }
      
      loadOrders(status);
    }
    
    async function loadOrders(status = null) {
      const filterStatus = status || currentOrderFilter;
      
      try {
        const url = filterStatus !== 'All'
          ? `/api/distributor/${currentUser.UserID}/orders?status=${filterStatus}`
          : `/api/distributor/${currentUser.UserID}/orders`;
          
        const response = await fetch(url);
        const orders = await response.json();
        
        console.log('Orders loaded:', orders.length, 'orders');
        
        const ordersList = document.getElementById('ordersList');
        
        if (!orders || orders.length === 0) {
          ordersList.innerHTML = `<p class="empty">No ${filterStatus !== 'All' ? filterStatus.toLowerCase() : ''} orders found.</p>`;
          return;
        }
        
        ordersList.innerHTML = `
          <table class="inventory-table distributor-orders-table">
            <thead>
              <tr>
                <th>Order</th>
                <th>Manufacturer</th>
                <th>Date</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${orders.map(order => `
                <tr>
                  <td>
                    <strong>#${order.OrderID}</strong><br>
                    <small>${order.PaymentTerms || 'Net 30'}</small>
                  </td>
                  <td>${order.ManufacturerName || 'N/A'}</td>
                  <td>${order.OrderDate ? new Date(order.OrderDate).toLocaleDateString() : '—'}</td>
                  <td>
                    <strong>${order.ItemCount || 0}</strong> items<br>
                    <small>${order.TotalQuantity || 0} units</small>
                  </td>
                  <td><strong>$${parseFloat(order.TotalAmount || 0).toFixed(2)}</strong></td>
                  <td>
                    <span class="badge ${getStatusBadgeClass(order.Status)}">
                      ${order.Status}
                    </span>
                  </td>
                  <td>
                    ${order.Status === 'Shipped'
                      ? `<button class="btn btn-primary" onclick="receiveOrder(${order.OrderID})">Receive Order</button>`
                      : order.Status === 'Received'
                        ? '<span style="color: #4caf50;">✓ Received</span>'
                        : '<span style="color: #666;">—</span>'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        console.error('Error loading orders:', error);
        document.getElementById('ordersList').innerHTML = '<p class="error">Error loading orders. Please try again.</p>';
      }
    }

    async function receiveOrder(orderId) {
      if (!confirm('Mark this order as received and update inventory?')) return;
      
      try {
        const response = await fetch(`/api/distributor/${currentUser.UserID}/orders/${orderId}/receive`, {
          method: 'PATCH'
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert('✅ ' + result.message);
          loadOrders();
          loadInventory();
          loadDistributorStats();
        } else {
          alert('❌ ' + result.message);
        }
      } catch (error) {
        console.error('Error receiving order:', error);
        alert('Failed to receive order.');
      }
    }

    // Load Sales to Retailers
    let currentSalesFilter = 'All';

    function filterSales(evt, status) {
      currentSalesFilter = status;
      
      if (evt) {
        document.querySelectorAll('#sales .filter-btn').forEach(btn => btn.classList.remove('active'));
        evt.currentTarget.classList.add('active');
      }
      
      loadSales();
    }

    async function loadSales() {
      const filterStatus = currentSalesFilter === 'All' ? null : currentSalesFilter;
      
      try {
        const url = filterStatus 
          ? `/api/distributor/${currentUser.UserID}/sales?status=${filterStatus}`
          : `/api/distributor/${currentUser.UserID}/sales`;
          
        const response = await fetch(url);
        const sales = await response.json();
        
        console.log('Sales loaded:', Array.isArray(sales) ? sales.length : 0, 'orders');
        
        const salesList = document.getElementById('salesList');
        
        if (!sales || sales.length === 0) {
          salesList.innerHTML = `<p class="empty">No ${filterStatus ? filterStatus.toLowerCase() : ''} sales orders found.</p>`;
          return;
        }
        
        salesList.innerHTML = `
          <table class="inventory-table distributor-sales-table">
            <thead>
              <tr>
                <th>Order</th>
                <th>Retailer</th>
                <th>Date</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${sales.map(order => `
                <tr>
                  <td>
                    <strong>#${order.OrderID}</strong><br>
                    <small>${order.PaymentTerms || 'Net 30'}</small>
                  </td>
                  <td>
                    <strong>${order.RetailerName || 'N/A'}</strong><br>
                    <small>${order.RetailerAddress || ''}</small>
                  </td>
                  <td>${order.OrderDate ? new Date(order.OrderDate).toLocaleDateString() : '—'}</td>
                  <td>
                    <strong>${order.ItemCount || 0}</strong> items<br>
                    <small>${order.TotalUnits || 0} units</small><br>
                    <button class="btn" style="margin-top: 0.5rem; padding: 0.3rem 0.6rem;"
                      onclick="viewSalesItems(${order.OrderID}, ${JSON.stringify(order.Items || []).replace(/"/g, '&quot;')})">
                      View Items
                    </button>
                  </td>
                  <td><strong>$${parseFloat(order.TotalAmount || 0).toFixed(2)}</strong></td>
                  <td>
                    <span class="badge ${getStatusBadgeClass(order.Status)}">
                      ${order.Status}
                    </span>
                  </td>
                  <td>
                    ${order.Status === 'Pending' ? `
                      <button class="btn btn-primary" onclick="confirmSalesOrder(${order.OrderID})">Confirm</button>
                    ` : order.Status === 'Confirmed' ? `
                      <button class="btn btn-primary" onclick="shipSalesOrder(${order.OrderID})">Ship</button>
                    ` : order.Status === 'Shipped' ? `
                      <span style="color: #2196f3;">In Transit</span>
                    ` : order.Status === 'Received' ? `
                      <span style="color: #4caf50;">Delivered</span>
                    ` : '<span style="color: #666;">—</span>'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        console.error('Error loading sales:', error);
        document.getElementById('salesList').innerHTML = '<p class="error">Error loading sales orders. Please try again.</p>';
      }
    }

    function viewSalesItems(orderId, items) {
      if (!items || !items.length) {
        alert('No items found for this order.');
        return;
      }
      
      const list = items.map(item => 
        `• ${item.ProductName}: ${item.Quantity} units @ $${parseFloat(item.UnitPrice || 0).toFixed(2)} = $${parseFloat(item.LineTotal || 0).toFixed(2)}`
      ).join('\\n');
      
      alert(`Order #${orderId} Items:\\n\\n${list}`);
    }

    // Confirm Sales Order
    async function confirmSalesOrder(orderId) {
      if (!confirm('Confirm this order and reserve inventory?')) return;
      
      try {
        const response = await fetch(`/api/distributor/${currentUser.UserID}/sales/${orderId}/confirm`, {
          method: 'PATCH'
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert('✅ ' + result.message);
          loadSales();
          loadInventory();
          loadDistributorStats();
        } else {
          alert('❌ ' + result.message);
        }
      } catch (error) {
        console.error('Error confirming order:', error);
        alert('Failed to confirm order.');
      }
    }

    // Ship Sales Order
    async function shipSalesOrder(orderId) {
      if (!confirm('Mark this order as shipped?')) return;
      
      try {
        const response = await fetch(`/api/distributor/${currentUser.UserID}/sales/${orderId}/ship`, {
          method: 'PATCH'
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert('✅ ' + result.message);
          loadSales();
          loadInventory();
          loadDistributorStats();
        } else {
          alert('❌ ' + result.message);
        }
      } catch (error) {
        console.error('Error shipping order:', error);
        alert('Failed to ship order.');
      }
    }

    // Load Inventory
    async function loadInventory() {
      try {
        if (!currentUser || !currentUser.UserID) {
          throw new Error('User not logged in properly. Please log in again.');
        }
        
        console.log('Loading inventory for UserID:', currentUser.UserID);
        const response = await fetch(`/api/distributor/${currentUser.UserID}/inventory`);
        
        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || `HTTP ${response.status}: ${response.statusText}`);
        }
        
        const inventory = await response.json();
        console.log('Inventory loaded:', inventory.length, 'items');
        
        const tbody = document.getElementById('inventoryTableBody');
        
        if (!Array.isArray(inventory)) {
          throw new Error('Invalid inventory data received');
        }
        
        if (inventory.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No inventory yet. Place orders from manufacturers!</td></tr>';
          return;
        }
        
        // Store inventory globally
        window.inventoryItems = inventory;
        
        tbody.innerHTML = inventory.map((item, index) => {
          const profitMargin = item.ProfitMargin ? parseFloat(item.ProfitMargin).toFixed(1) + '%' : 'Not Set';
          const profitClass = item.ProfitMargin && parseFloat(item.ProfitMargin) > 0 ? 'profit-positive' : '';
          
          return `
            <tr>
              <td><strong>${item.ProductName}</strong></td>
              <td>${item.ManufacturerName}</td>
              <td>${item.AvailableForSale}</td>
              <td>${item.QuantityReserved}</td>
              <td>$${parseFloat(item.PurchasePriceFromManufacturer).toFixed(2)}</td>
              <td>${item.SellPriceToRetailer ? '$' + parseFloat(item.SellPriceToRetailer).toFixed(2) : 'Not Set'}</td>
              <td><span class="${profitClass}">${profitMargin}</span></td>
              <td>
                <button class="btn" onclick="openPricingModal(${index})">
                  Set Price
                </button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (error) {
        console.error('Error loading inventory:', error);
        const errorMsg = error.message || 'Unknown error occurred';
        document.getElementById('inventoryTableBody').innerHTML = `<tr><td colspan="8" style="text-align: center;" class="error">Error: ${errorMsg}<br><small>Check console for details.</small></td></tr>`;
      }
    }

    // Pricing Modal
    function openPricingModal(itemIndex) {
      const item = window.inventoryItems[itemIndex];
      if (!item) {
        alert('Item not found');
        return;
      }
      document.getElementById('pricingProductId').value = item.ProductID;
      document.getElementById('pricingProductName').value = item.ProductName;
      document.getElementById('pricingPurchasePrice').value = '$' + item.PurchasePriceFromManufacturer;
      document.getElementById('pricingSellPrice').value = item.SellPriceToRetailer || '';
      
      updateProfitMargin();
      
      document.getElementById('pricingModal').classList.add('active');
    }

    function closePricingModal() {
      document.getElementById('pricingModal').classList.remove('active');
      document.getElementById('setPricingForm').reset();
    }

    function updateProfitMargin() {
      const purchasePrice = parseFloat(document.getElementById('pricingPurchasePrice').value.replace('$', ''));
      const sellPrice = parseFloat(document.getElementById('pricingSellPrice').value);
      
      if (sellPrice && purchasePrice) {
        const margin = ((sellPrice - purchasePrice) / purchasePrice * 100).toFixed(2);
        document.getElementById('pricingProfitMargin').value = margin + '%';
      } else {
        document.getElementById('pricingProfitMargin').value = '';
      }
    }

    document.getElementById('pricingSellPrice').addEventListener('input', updateProfitMargin);

    async function submitPricing(event) {
      event.preventDefault();
      
      const productId = document.getElementById('pricingProductId').value;
      const sellPrice = parseFloat(document.getElementById('pricingSellPrice').value);
      
      try {
        const response = await fetch(`/api/distributor/${currentUser.UserID}/inventory/${productId}/pricing`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ SellPriceToRetailer: sellPrice })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert(`✅ ${result.message}\nProfit Margin: ${result.ProfitMargin}`);
          closePricingModal();
          loadInventory();
        } else {
          alert('❌ ' + result.message);
        }
      } catch (error) {
        console.error('Error updating pricing:', error);
        alert('Failed to update pricing.');
      }
    }

    // Helper Functions
    function getStatusBadgeClass(status) {
      const classes = {
        'Pending': 'warning',
        'Confirmed': 'info',
        'Shipped': 'info',
        'Received': 'success',
        'Cancelled': 'danger'
      };
      return classes[status] || 'secondary';
    }

    function logout() {
      sessionStorage.clear();
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    // Initialize on page load
    init();
  </script>
</body>
