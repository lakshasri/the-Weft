<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the-Weft SCM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-brand">
      <img src="assets/logo.png" alt="the-Weft logo" class="logo">
      <h1>the-Weft Supply Chain</h1>
    </div>
    <nav>
      <button id="logout-btn" hidden>Logout</button>
    </nav>
  </header>

  <main id="app">
    <!-- Auth View -->
    <section id="auth-view" class="view">
      <div class="card">
        <h2 id="auth-title">Sign In</h2>

        <!-- Login Form -->
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
          </div>
          <button type="submit" class="btn">Sign In</button>
          <p id="login-error" class="error"></p>
        </form>

        <!-- Signup Form (hidden by default) -->
        <form id="signup-form" hidden>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="FullName" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="Email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="Password" placeholder="Create password" required>
          </div>
          <div class="form-group">
            <label>Role</label>
            <select name="Role" required>
              <option value="">Select...</option>
              <option value="Customer">Customer</option>
              <option value="Retailer">Retailer</option>
              <option value="Manufacturer">Manufacturer</option>
              <option value="Distributor">Distributor</option>
            </select>
          </div>
          <div class="form-group">
            <label>Address</label>
            <textarea name="Address" rows="2" placeholder="Your address"></textarea>
          </div>
          <button type="submit" class="btn">Create Account</button>
          <p id="signup-error" class="error"></p>
        </form>

        <p class="toggle">
          <button type="button" id="toggle-form" class="link">Create account</button>
        </p>
      </div>
    </section>

    <!-- Dashboard View -->
    <section id="dashboard-view" class="view" hidden>
      <div class="dashboard-header">
        <h2 id="user-name">Welcome</h2>
        <p id="user-role"></p>
      </div>

      <!-- Manufacturer Section -->
      <section id="manufacturer-panel" class="panel" hidden>
        <div id="manufacturer-stats" class="stat-grid"></div>

        <div class="tabs manufacturer-tabs">
          <button class="tab manufacturer-tab active" onclick="showManufacturerTab('products')">Products</button>
          <button class="tab manufacturer-tab" onclick="showManufacturerTab('inventory')">Inventory</button>
          <button class="tab manufacturer-tab" onclick="showManufacturerTab('orders')">Orders</button>
        </div>

        <div id="tab-products" class="tab-content active">
          <div class="section">
            <div class="section-header">
              <h2>Product Catalog</h2>
              <button onclick="showCreateProductModal()">Create Product</button>
            </div>
            <div id="product-list" class="table-responsive"></div>
          </div>
        </div>

        <div id="tab-inventory" class="tab-content">
          <div class="section">
            <div class="section-header">
              <h2>Inventory Management</h2>
              <button onclick="loadManufacturerInventory()">Refresh</button>
            </div>
            <div id="inventory-list" class="table-responsive"></div>
          </div>
        </div>

        <div id="tab-orders" class="tab-content">
          <div class="section">
            <div class="section-header">
              <h2>Distributor Orders</h2>
              <div class="order-filters">
                <button class="filter-btn active" onclick="filterOrders(event, 'All')">All</button>
                <button class="filter-btn" onclick="filterOrders(event, 'Pending')">Pending</button>
                <button class="filter-btn" onclick="filterOrders(event, 'Confirmed')">Confirmed</button>
                <button class="filter-btn" onclick="filterOrders(event, 'Shipped')">Shipped</button>
                <button class="filter-btn" onclick="filterOrders(event, 'Received')">Received</button>
              </div>
            </div>
            <div id="orders-list" class="table-responsive"></div>
          </div>
        </div>
      </section>

      <!-- Retailer Section -->
      <section id="retailer-panel" class="panel" hidden>
        <h3>Retailer Dashboard</h3>
        
        <div style="margin-bottom: 1rem;">
          <button class="btn" onclick="showProfitAnalysis()" style="background: #FF5722; margin-right: 0.5rem;">💰 Profit Analysis</button>
          <button class="btn" onclick="loadRetailerData()" style="background: #4CAF50;">🔄 Refresh Data</button>
        </div>
        
        <h4>Available Products</h4>
        <div id="available-products" class="list"></div>
        <h4 style="margin-top: 2rem;">Your Inventory</h4>
        <div id="retailer-inventory" class="list"></div>
        <h4 style="margin-top: 2rem;">Orders</h4>
        <div id="retailer-orders" class="list"></div>
      </section>

      <!-- Customer Section -->
      <section id="customer-panel" class="panel" hidden>
        <h3>Customer</h3>
        <h4>Available Products</h4>
        <div id="catalog" class="list"></div>
        <h4 style="margin-top: 2rem;">Cart</h4>
        <div id="cart" class="list"></div>
        <form id="checkout-form">
          <div class="form-group">
            <label>Shipping Address</label>
            <textarea name="ShippingAddress" rows="2" placeholder="Address" required></textarea>
          </div>
          <button type="submit" class="btn">Place Order</button>
          <p id="checkout-error" class="error"></p>
        </form>
        <h4 style="margin-top: 2rem;">Your Orders</h4>
        <div id="customer-orders" class="list"></div>
      </section>

      <!-- Distributor Section -->
      <section id="distributor-panel" class="panel" hidden>
        <h3>Distributor</h3>
        <div id="distributor-orders" class="list"></div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
